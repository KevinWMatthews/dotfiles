###
# Settings
###

# Mouse selection
# Enables pane selection, window selection, copy mode, etc
set -g mouse on

# TODO Is this still necessary?
set -g set-clipboard on

# because it's cool
set -g mode-keys vi

# For tmux-yank to work with vi key bindings
# prefix y won't work without this
set -g @shell_mode 'vi'

# Settings for tmux-yank
set -g @override_copy_command 'xclip -selection clipboard -i'
# set -g @custom_copy_command
set -g @custom_paste_command 'xclip -selection clipboard -o' # not in tmux-yank but used locally
set -g @yank_selection 'clipboard'

# Set how long status messages display
set -g display-time 2000

# Set title and status bars
set -g set-titles on
set -g status-position top

# Color
# Truecolor (24-bit RGB) passthrough.
# Without this, tmux downsamples colors to the 256-color palette.
# This noticeably shifts theme colors and can wash out low-contrast text like comments.
set -ag terminal-overrides ",*:RGB"

# Start window number at 1
#set -g base-index 1
# Start pane numbering at 1
# setw -g pane-base-index 1
