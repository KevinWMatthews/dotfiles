###
# Plugins
###

# Plugins are automatically loaded by Tmux Plugin Manager (tpm)
# For more plugins, see:
# https://github.com/tmux-plugins/list

# Keymap:
# <prefix> + I: update tmux environment (and install plugins)
# <prefix> + U: update installed plugins
# <prefix> + <alt> + u: uninstall unused plugins

# TODO Consider these plugins:
#
# https://github.com/tmux-plugins/tmux-cowboy
# https://github.com/brendandebeasi/tabby
# https://github.com/kiyoon/treemux
# https://github.com/schasse/tmux-jump
# https://github.com/erikw/tmux-powerline

# 
# https://github.com/sainnhe/tmux-fzf
set -g @plugin 'sainnhe/tmux-fzf'
source-file ~/.config/tmux/fzf-options.conf

# Easy URL navigation using the fzf fuzzy finder
# https://github.com/wfxr/tmux-fzf-url
# Automatically installed on first use:
# https://github.com/wfxr/xre
set -g @plugin 'wfxr/tmux-fzf-url'

# Easy logging configuration
# https://github.com/tmux-plugins/tmux-logging
# TODO learn and configure this
set -g @plugin 'tmux-plugins/tmux-logging'

# Customizable status bar
# https://github.com/erikw/tmux-powerline
set -g @plugin 'erikw/tmux-powerline'

# Vim-like clipboard 
# https://github.com/tmux-plugins/tmux-yank
set -g @plugin 'tmux-plugins/tmux-yank'

# Seamless pane switching between vim and tmux
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize tpack, a tpm-compatible plugin manager
# https://github.com/tmuxpack/tpack
run 'tpack init'
