###
# Welcome!
#
# This is my tmux configuration.
# My tastes change wildly as I learn. Enjoy the ride :)
#
# Assumes tmux 3.6
#
# Note: to enable Neovim syntax highlighting for tmux config files,
# filenames must start with `tmux` or `.tmux` and end with `.conf`.
###

# Load general tmux settings
source-file ~/.config/tmux/tmux-settings.conf

# Load plugins
source-file ~/.config/tmux/tmux-plugins.conf

# Load keybindings after plugins so that my custom keybindings override plugin defaults
source-file ~/.config/tmux/tmux-key-bindings.conf
