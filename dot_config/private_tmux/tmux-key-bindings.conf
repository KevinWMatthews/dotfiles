###
# Leader
###
# Re-bind tmux prefix from Ctrl-b to Ctrl-<space>
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


###
# Reload
###
# Reload tmux configuration: prefix r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

#
# prefix-I: reload tmux environment (and install plugins)
# prefix-U: update installed pluginsto work
# prefix-M-u: uninstall unused plugins


