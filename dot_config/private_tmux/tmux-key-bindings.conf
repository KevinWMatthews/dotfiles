###
# Windows
# TODO start new window in the current directory
###
unbind-key %
bind-key v split-window -h -c "#{pane_current_path}"
unbind-key '"'
bind-key h split-window -v -c "#{pane_current_path}"

# Create new window in the current path
bind-key c new-window -c "#{pane_current_path}"

###
# Pane Switching
###
# Switch between both vim and tmux panes with (via vim-tmux-navigator):
# C-h, C-j, C-k, C-l

# Unbind vim-tmux-navigator's binding for previous pane to allow SIGQUIT
unbind -n C-\\

###
# Window Switching
###
# Switch between vim windows with (via my vim configuration):
# Alt-h, Alt-l
#
# Switch between tmux windows with:
# Alt-Shift-H, Alt-Shift-L
bind-key -n M-L next-window
bind-key -n M-H previous-window

# Swap/move window positions
bind-key -n M-P {
    swap-window -t -1
    select-window -t -1
}
bind-key -n M-N {
    swap-window -t +1
    select-window -t +1
}

###
# Mouse
###
# TODO: experiment with this
# don't auto-copy or exit copy mode when a mouse drag-selection ends.
# Without this, tmux's own default (and tmux-yank's @yank_with_mouse)
# both copy-and-cancel on mouse release.
# Leaving the selection active lets it be extended/reviewed,
# then copied explicitly afterward with 'y'/'Y'/'Enter'
bind-key -T copy-mode-vi MouseDragEnd1Pane {}


###
# Copy Mode
###
# Based on the plugins tmux-yank (installed) and tmux-normalmode (not installed)
#
## Select
# v:    selection
# V:    line selection
# C-v:  block/rectangle selection
#
## Copy, selection inactive
# y:    copy to clipboard
# Y:    copy to clipboard and paste to terminal
#
## Copy, selection active
# y:    copy to clipboard
# Y:    copy to clipboard and paste to terminal
#
# Tmux buffers, selection active:
# Enter:    copy
# Paste:    prefix-]
# Buffers:  prefix-=
#
# Cancel:
# Esc
# (not implemented) i
# (not implemented) a
#
# Prompt navigation:
# s:    start of current prompt
# [:    previous prompt
# C-p:  previous prompt
# ]:    next prompt
# C-n:  next prompt
#
# Note: this requires OSC 133 prompt markers in the shell prompt.
# Required:
# - PS1 contains start prompt indicator, `\[\e]133;A\e\\\]`
# - prompt symbol \$ is on a new line
#
# Optional
# - PS0 contains start command indicator, `\[\e]133;C\e\\\]`
# - PS1 contains end prompt indicator, `\[\e]133;A\e\\\]`
#
# TODO
# Reconsider Alt-y

# When in copy mode, enter selection mode with 'v'.
# (tmux's default for 'v' is rectangle-toggle, not begin-selection)
bind-key -T copy-mode-vi v {
    send-keys -X begin-selection
    # Force rectangle mode off so a leftover rectangle selection from a previous 'C-v' doesn't carry over
    send-keys -X rectangle-off
}

# When in copy mode, enter line selection mode with 'V'
bind-key -T copy-mode-vi V send-keys -X select-line

# When in copy mode, enter rectangle selection mode with 'C-v'
bind-key -T copy-mode-vi C-v {
    send-keys -X begin-selection
    # Set rectangle-mode on in case a prior selection turned it off
    send-keys -X rectangle-on
}

# 'i' and 'a' cancel copy mode, like leaving vim normal mode back to insert
#bind-key -T copy-mode-vi i {
#    send-keys -X cancel
#    send-keys C-a
#}
#bind-key -T copy-mode-vi a send-keys -X cancel

# When in copy mode, Enter copies to tmux's internal paste buffer and _not_ the system clipboard
# Leave this default setting

# Copy to clipboard:
# - selection if one is active
# - cursor to end of line otherwise
bind-key -T copy-mode-vi y if -F "#{selection_present}" {
    send-keys -X copy-pipe-and-cancel "#{@override_copy_command}"
} {
    send-keys -X begin-selection
    send-keys -X end-of-line
    # Trim trailing newline.
    send-keys -X copy-pipe-and-cancel "tr -d '\n' | #{@override_copy_command}"
}

# Copy to clipboard and paste to terminal:
# - selection if one is active
# - cursor to end of line otherwise
bind-key -T copy-mode-vi Y if -F "#{selection_present}" {
    send-keys -X copy-pipe-and-cancel "#{@override_copy_command}; tmux paste-buffer -p"
} {
    send-keys -X begin-selection
    send-keys -X end-of-line
    # strip newline before copying to clipboard/buffer. #{@custom_paste_command}
    # must be wrapped in $(...) so the shell actually RUNS it and captures its
    # stdout - without that, tmux just hands set-buffer the option's literal
    # text as the buffer content instead of the command's output (and $(...)
    # conveniently strips the trailing newline too).
    send-keys -X copy-pipe-and-cancel "tr -d '\n' | #{@override_copy_command}; tmux set-buffer \"$(#{@custom_paste_command})\"; tmux paste-buffer -p"
}

# Unbind tmux-yank's Alt-y yanking; I don't use it
unbind-key -T copy-mode-vi M-y

# Navigate to previous prompt
bind-key -T copy-mode-vi [ {
    send-keys -X previous-prompt
    send-keys -X previous-prompt
    # Prompt symbol is on the next line; navigate to it
    send-keys -X cursor-down

    # navigate past prompt symbol to start of actual shell command
    send-keys -X end-of-line

    # Check if shell command is empty
    if -F "#{==:#{copy_cursor_x},1}" {
        # shell command was empty; stay here
    } {
        # shell command was not empty; navigate past the prompt symbol and leading spaces (the '$ ')
        send-keys -X start-of-line
        send-keys -X -N 2 cursor-right
    }
}
bind-key -T copy-mode-vi C-p send-keys [

# Navigate to next prompt
bind-key -T copy-mode-vi ] {
    # To avoid scrolling past the last prompt,
    # track each "jump position" - the cursor y value and scroll position.
    # This is stored in the tmux environment and persists across keystrokes.
    #
    # set-F expands #{..} instead of storing it literally
    set -F @prompt_nav_pos "#{scroll_position}:#{copy_cursor_y}"

    send-keys -X next-prompt

    # Check if jump position changed
    if -F "#{==:#{scroll_position}:#{copy_cursor_y},#{@prompt_nav_pos}}" {
        # jump position didn't change from the last call; already at (or past) the last prompt
    } {
        # otherwise jump position changed; navigate to the shell command

        # Prompt symbol is on the next line; navigate to it
        send-keys -X cursor-down

        # Navigate past prompt symbol to start of actual shell command
        send-keys -X end-of-line

        # Check if shell command is empty
        if -F "#{==:#{copy_cursor_x},1}" {
            # shell command was empty; stay here
        } {
            # shell command was not empty; navigate past the prompt symbol and leading spaces (the '$ ')
            send-keys -X start-of-line
            send-keys -X -N 2 cursor-right
        }
    }
}
bind-key -T copy-mode-vi C-n send-keys ]

bind-key -T copy-mode-vi s {
    # Shell prompt is on next line, so go to the previous prompt.
    send-keys -X previous-prompt

    # Prompt symbol is on the next line; navigate to it
    send-keys -X cursor-down
    # Navigate past prompt symbol to start of actual shell command
    send-keys -X end-of-line

    # Check if shell command is empty
    if -F "#{==:#{copy_cursor_x},1}" {
        # shell command was empty; stay here
    } {
            # shell command was not empty; navigate past the prompt symbol and leading spaces (the '$ ')
        send-keys -X start-of-line
        send-keys -X -N 2 cursor-right
    }
}
